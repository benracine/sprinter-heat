<script>
/* Screen TOC: highlight the section currently in view, and keep it visible in the sidebar. */
(function () {
  if (window.matchMedia && !window.matchMedia("screen").matches) return;

  var toc = document.getElementById("TOC");
  if (!toc) return;

  var links = Array.prototype.slice.call(toc.querySelectorAll('a[href^="#"]'));
  if (!links.length) return;

  var entries = [];
  for (var i = 0; i < links.length; i++) {
    var href = links[i].getAttribute("href");
    if (!href || href === "#") continue;
    var id = decodeURIComponent(href.slice(1));
    var el = document.getElementById(id);
    if (el) entries.push({ link: links[i], el: el });
  }
  if (!entries.length) return;

  var active = null;
  var ticking = false;
  var headerOffset = 72;

  function setActive(next) {
    if (next === active) return;
    if (active) {
      active.classList.remove("is-active");
      active.removeAttribute("aria-current");
    }
    active = next;
    if (!active) return;
    active.classList.add("is-active");
    active.setAttribute("aria-current", "location");
    var li = active.closest("li");
    if (li) {
      var top = li.offsetTop;
      var bottom = top + li.offsetHeight;
      var viewTop = toc.scrollTop;
      var viewBottom = viewTop + toc.clientHeight;
      if (top < viewTop + 24) {
        toc.scrollTop = Math.max(0, top - 24);
      } else if (bottom > viewBottom - 24) {
        toc.scrollTop = bottom - toc.clientHeight + 24;
      }
    }
  }

  function update() {
    ticking = false;
    var y = window.scrollY + headerOffset;
    var current = entries[0].link;
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].el.offsetTop <= y) current = entries[i].link;
      else break;
    }
    /* Near page bottom: last section wins */
    var docBottom = window.scrollY + window.innerHeight;
    var maxScroll = document.documentElement.scrollHeight - 4;
    if (docBottom >= maxScroll) {
      current = entries[entries.length - 1].link;
    }
    setActive(current);
  }

  function onScroll() {
    if (!ticking) {
      ticking = true;
      window.requestAnimationFrame(update);
    }
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll, { passive: true });
  update();
})();
</script>
